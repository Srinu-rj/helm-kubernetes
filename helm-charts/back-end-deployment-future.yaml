# Source: backend/templates/azure-key-vault.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-azure-key-vault
  namespace: back-end-future-namespace
  spec:
    provider: azure
    parameters:
      usePodIdentity: "false"
      useVMManagedIdentity: "true"
      userAssignedIdentityID: 73643746732467346f54374
      keyvaultName: 7364374673246734rerer346374
      tenantId: 736437467324673467346374
      objects: | 
        array:
          - |
            objectName: db-password  
            objectType: secret
          - |
            objectName: db-username  
            objectType: secret
    secretObjects:
      - data:
          - key: "password"
            objectName: "db-password"
          - key: "username"
            objectName: "db-username"
        secretName: "db-credentials"
        type: Opaque
