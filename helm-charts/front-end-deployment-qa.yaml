---
# Source: front-end/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: front-qa-namespace
  labels:
    app.kubernetes.io/managed-by: Helm
    pod-security.kubernetes.io/enforce: restricted   # strictest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    meta.helm.sh/release-name: frontend-qa-deployment
    meta.helm.sh/release-namespace: default
---
# Source: front-end/templates/service.yml
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: front-qa-namespace
  labels:
    app: frontend
    env: front-end
spec:
  selector:
    app: frontend
    env: front-end
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      protocal: http
  type: ClusterIP
---
# Source: front-end/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end-deployment
  namespace: front-qa-namespace
  labels:
    app: frontend
    env: front-end
spec:
  selector:
    matchLabels:
      app: frontend
      env: front-end
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        env: front-end
    spec:
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault   # ← pod level
      containers:
        - name: frontendcontainer
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault  # ← container level
          image: "mahesh032/angular-web-app:71"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
