app:
  deploymentName: front-end-deployment
  replicaCount: 4
  env: front-end

service:
  enabled: true
  name: frontend-service
  type: ClusterIP
  port: 80

namespace:
  enabled: true
  name: front-qa-namespace

image:
  repository: mahesh032/angular-web-app
  pullPolicy: IfNotPresent
  tag: 71
  containerPort: 80
  containerName: frontendcontainer

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 3
    maxUnavailable: 0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: aks-sc-front-end
  provisioner: file.csi.azure.com

PersistentVolumeClaim:
  enabled: false
  name: aks-pvc

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  fsGroup: 2000
  seccompProfile:          # ← missing here
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

resources:
   limits:
     cpu: 100m
     memory: 128Mi
   requests:
     cpu: 100m
     memory: 128Mi








