apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.application.name }}
  namespace: {{ .Values.application.namespace }}
spec:
  project: {{ .Values.application.project }}
  source:
    repoURL: {{ .Values.source.repoURL }}
    targetRevision: {{ .Values.source.targetRevision }}
    path: {{ .Values.source.path }}
    helm:
      valueFiles:
        {{ .Values.source.helm.valueFiles }}
destination:
  server: {{ .Values.destination.server }}
  namespace: {{ .Values.destination.namespace }}
syncPolicy:
  automated:
    prune: {{ .Values.syncPolicy.automated.prune }}
    selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
  syncOptions:
    {{- toYaml .Values.syncPolicy | nindent 4 }}


---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Srinu-rj/helm-kubernetes
    targetRevision: master
    path: helm-charts/backend
    helm:
      valueFiles:
        - values-qa.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: back-end-qa-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---