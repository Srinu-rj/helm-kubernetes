# templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-connection
  namespace: {{ .Values.namespace.defaultNamespace }}
  labels:
    {{- include "app-label" . | nindent 4 }}    # ← this helper works already
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: curlimages/curl:latest
      command: ['curl']
      args:
        - '--connect-timeout'
        - '5'
        - '--silent'
        - '--show-error'
        - 'http://{{ .Values.service.serviceApp }}:{{ .Values.service.port }}/health'
---